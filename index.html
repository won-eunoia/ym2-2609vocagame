<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VOCA-PIONEER 듣기 퀴즈 &amp; 카드 맞추기</title>
<style>
:root {
  --purple: #7B5EA7;
  --dark-purple: #4A3568;
  --gold: #C9A84C;
  --light-purple: #F3EFFE;
  --bg: #FBFAF8;
  --card-bg: #FFFFFF;
  --text: #2B2532;
  --text-soft: #6B6178;
  --border: #E4DEF0;
  --good: #3F9A5C;
  --bad: #C6553E;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1C1720;
    --card-bg: #2A2233;
    --text: #F1ECF7;
    --text-soft: #B8ACC9;
    --border: #423755;
    --light-purple: #352A44;
  }
}
:root[data-theme="dark"] {
  --bg: #1C1720;
  --card-bg: #2A2233;
  --text: #F1ECF7;
  --text-soft: #B8ACC9;
  --border: #423755;
  --light-purple: #352A44;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  min-height: 100%;
}
header {
  padding: 20px 16px 14px;
  text-align: center;
  border-bottom: 1px solid var(--border);
  background: var(--card-bg);
}
header h1 {
  margin: 0 0 4px;
  font-size: 20px;
  color: var(--dark-purple);
  font-weight: 800;
  letter-spacing: -0.01em;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) header h1 { color: #D8C6F2; }
}
:root[data-theme="dark"] header h1 { color: #D8C6F2; }
header p {
  margin: 0;
  font-size: 13px;
  color: var(--text-soft);
}
.tabs {
  display: flex;
  gap: 8px;
  padding: 12px 16px 0;
  max-width: 640px;
  margin: 0 auto;
}
.tab-btn {
  flex: 1;
  padding: 10px 8px;
  border: none;
  border-radius: 10px 10px 0 0;
  background: var(--light-purple);
  color: var(--text-soft);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.tab-btn.active {
  background: var(--purple);
  color: #fff;
}
main {
  max-width: 640px;
  margin: 0 auto;
  padding: 16px 16px 40px;
}
.panel {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 0 10px 10px 10px;
  padding: 20px 16px;
}
.hidden { display: none !important; }

/* ---- Listening quiz ---- */
.quiz-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  font-size: 13px;
  color: var(--text-soft);
}
.quiz-score { font-weight: 700; color: var(--dark-purple); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .quiz-score { color: #D8C6F2; }
}
:root[data-theme="dark"] .quiz-score { color: #D8C6F2; }

.direction-toggle {
  display: flex;
  gap: 6px;
  justify-content: center;
  margin-bottom: 16px;
}
.direction-toggle button {
  padding: 6px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text-soft);
  font-size: 12px;
  cursor: pointer;
}
.direction-toggle button.active {
  background: var(--dark-purple);
  color: #fff;
  border-color: var(--dark-purple);
}

.speak-area {
  text-align: center;
  padding: 28px 12px;
  background: var(--light-purple);
  border-radius: 12px;
  margin-bottom: 18px;
}
.speak-btn {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  border: none;
  background: var(--purple);
  color: #fff;
  font-size: 30px;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(123,94,167,0.35);
}
.speak-btn:active { transform: scale(0.95); }
.speak-hint {
  margin-top: 10px;
  font-size: 12px;
  color: var(--text-soft);
}

.choices {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
}
.choice-btn {
  padding: 14px 16px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--card-bg);
  color: var(--text);
  font-size: 15px;
  text-align: left;
  cursor: pointer;
  transition: border-color 0.12s, background 0.12s;
}
.choice-btn:hover { border-color: var(--purple); }
.choice-btn.correct { border-color: var(--good); background: rgba(63,154,92,0.12); font-weight: 700; }
.choice-btn.wrong { border-color: var(--bad); background: rgba(198,85,62,0.12); }
.choice-btn:disabled { cursor: default; }

.next-row {
  display: flex;
  justify-content: center;
  margin-top: 18px;
}
.next-btn {
  padding: 10px 28px;
  border-radius: 999px;
  border: none;
  background: var(--dark-purple);
  color: #fff;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
}
.next-btn:disabled { opacity: 0.4; cursor: default; }

.round-score {
  text-align: center;
  font-size: 22px;
  font-weight: 800;
  color: var(--dark-purple);
  margin-bottom: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .round-score { color: #D8C6F2; }
}
:root[data-theme="dark"] .round-score { color: #D8C6F2; }
.wrong-list-title {
  text-align: center;
  font-size: 13px;
  color: var(--text-soft);
  margin: 10px 0 12px;
}
.wrong-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 360px;
  overflow-y: auto;
}
.wrong-item {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 8px;
  background: rgba(198,85,62,0.08);
  border: 1px solid rgba(198,85,62,0.25);
  font-size: 14px;
}
.wrong-item .w-eng { font-weight: 700; color: var(--bad); }
.wrong-item .w-kor { color: var(--text-soft); text-align: right; }
.no-wrong {
  text-align: center;
  padding: 20px;
  color: var(--good);
  font-weight: 700;
}
.round-transition {
  text-align: center;
  padding: 10px 12px;
  margin-bottom: 12px;
  border-radius: 8px;
  background: var(--light-purple);
  color: var(--dark-purple);
  font-size: 13px;
  font-weight: 700;
}

/* ---- Matching game ---- */
.match-controls {
  display: flex;
  gap: 8px;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 14px;
  font-size: 13px;
}
.match-controls select {
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
}
.new-game-btn {
  padding: 7px 16px;
  border-radius: 999px;
  border: none;
  background: var(--purple);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.match-status {
  text-align: center;
  font-size: 13px;
  color: var(--text-soft);
  margin-bottom: 12px;
}
.match-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 8px;
}
.match-card {
  min-height: 76px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--light-purple);
  color: var(--dark-purple);
  font-size: 13px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 8px 6px;
  cursor: pointer;
  line-height: 1.3;
  transition: transform 0.12s, background 0.12s, border-color 0.12s;
  word-break: keep-all;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .match-card { color: #EADFFB; }
}
:root[data-theme="dark"] .match-card { color: #EADFFB; }
.match-card.matched {
  background: rgba(63,154,92,0.15);
  border-color: var(--good);
  color: var(--good);
  cursor: default;
}
.match-card.selected {
  border-color: var(--purple);
  background: var(--card-bg);
  transform: scale(0.97);
}
.match-card.eng { font-style: italic; }

.group-info {
  margin-top: 12px;
  padding: 12px;
  border-radius: 10px;
  background: var(--light-purple);
  font-size: 12px;
  line-height: 1.6;
}
.group-info .gi-title { font-weight: 800; margin-bottom: 6px; color: var(--dark-purple); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .group-info .gi-title { color: #D8C6F2; }
}
:root[data-theme="dark"] .group-info .gi-title { color: #D8C6F2; }
.group-info .gi-group { margin-bottom: 8px; }
.group-info .gi-item { display: block; }
.group-info .gi-item b { color: var(--purple); }
.win-banner {
  text-align: center;
  padding: 14px;
  margin-top: 14px;
  border-radius: 10px;
  background: rgba(63,154,92,0.12);
  color: var(--good);
  font-weight: 700;
  font-size: 14px;
}

footer {
  text-align: center;
  font-size: 11px;
  color: var(--text-soft);
  padding: 10px 16px 24px;
}

.hidden { display: none !important; }

.name-gate {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  z-index: 100;
}
.name-gate-box {
  max-width: 360px;
  width: 100%;
  text-align: center;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px 24px;
}
.name-gate-icon { font-size: 40px; margin-bottom: 8px; }
.name-gate-box h2 {
  margin: 0 0 8px;
  font-size: 19px;
  color: var(--dark-purple);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .name-gate-box h2 { color: #D8C6F2; }
}
:root[data-theme="dark"] .name-gate-box h2 { color: #D8C6F2; }
.name-gate-box p {
  margin: 0 0 18px;
  font-size: 13px;
  color: var(--text-soft);
  line-height: 1.5;
}
.name-gate-box input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  text-align: center;
  margin-bottom: 12px;
}
.name-gate-box button#nameSubmitBtn {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: var(--purple);
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
}
.name-gate-status {
  margin-top: 12px;
  font-size: 12px;
  color: var(--text-soft);
  min-height: 16px;
}

.player-name-tag {
  margin: 8px 0 0 !important;
  font-size: 12px !important;
  color: var(--text-soft) !important;
}
.player-name-tag span { font-weight: 700; color: var(--dark-purple); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .player-name-tag span { color: #D8C6F2; }
}
:root[data-theme="dark"] .player-name-tag span { color: #D8C6F2; }
.player-name-tag button {
  margin-left: 8px;
  border: none;
  background: none;
  color: var(--purple);
  font-size: 11px;
  text-decoration: underline;
  cursor: pointer;
  padding: 0;
}

.mastery-bar-wrap {
  max-width: 320px;
  margin: 10px auto 0;
}
.mastery-bar-track {
  height: 8px;
  border-radius: 999px;
  background: var(--light-purple);
  overflow: hidden;
}
.mastery-bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--purple), var(--gold));
  border-radius: 999px;
  transition: width 0.3s ease;
}
.mastery-bar-text {
  margin-top: 4px;
  font-size: 11px;
  color: var(--text-soft);
  text-align: center;
}

.save-indicator {
  text-align: center;
  font-size: 11px;
  color: var(--text-soft);
  margin-top: 8px;
  min-height: 14px;
}
</style>
</head>

<body>

<div class="name-gate" id="nameGate">
  <div class="name-gate-box">
    <div class="name-gate-icon">🎧</div>
    <h2>이름을 입력하세요</h2>
    <p>진행 상황이 저장되어, 다음에 같은 이름으로 들어오면 이어서 할 수 있어요.</p>
    <input type="text" id="nameInput" placeholder="예: 김민수" autocomplete="off">
    <button id="nameSubmitBtn">시작하기</button>
    <div class="name-gate-status" id="nameGateStatus"></div>
  </div>
</div>

<div id="appRoot" class="hidden">

<header>
  <h1>VOCA-PIONEER 어휘 게임</h1>
  <p>듣기 퀴즈 &amp; 카드 맞추기 · 2023·2024·2025년 9월 모의고사 어휘</p>
  <p class="player-name-tag">👤 <span id="playerNameTag"></span> <button id="switchUserBtn">다른 이름으로</button></p>
  <div class="mastery-bar-wrap">
    <div class="mastery-bar-track"><div class="mastery-bar-fill" id="masteryBarFill"></div></div>
    <div class="mastery-bar-text" id="masteryBarText">전체 어휘 진행: 0 / 703 (0%)</div>
  </div>
</header>

<div class="tabs">
  <button class="tab-btn active" id="tabQuizBtn">🔊 듣기 퀴즈</button>
  <button class="tab-btn" id="tabMatchBtn">🃏 카드 맞추기</button>
</div>

<main>
  <!-- Listening quiz panel -->
  <section class="panel" id="quizPanel">
    <div class="quiz-top">
      <span>라운드 <span id="roundNumLabel">1</span>/5 · 문제 <span id="quizIndex">1</span> / <span id="roundSizeLabel">30</span></span>
      <span class="quiz-score">정답 <span id="quizScore">0</span> / <span id="quizTotal">0</span></span>
    </div>
    <div class="save-indicator" id="saveIndicator"></div>

    <div class="direction-toggle">
      <button id="dirEngBtn" class="active">영단어 듣고 뜻 고르기</button>
      <button id="dirKorBtn">뜻 듣고 영단어 고르기</button>
    </div>

    <div id="quizQuestionArea">
      <div class="round-transition hidden" id="roundTransition"></div>
      <div class="speak-area">
        <button class="speak-btn" id="speakBtn" aria-label="다시 듣기">🔊</button>
        <div class="speak-hint">버튼을 눌러 소리를 들어보세요</div>
      </div>

      <div class="choices" id="choicesBox"></div>

      <div class="next-row">
        <button class="next-btn" id="nextBtn" disabled>다음 문제</button>
      </div>
    </div>

    <div id="quizResult" class="hidden">
      <div class="round-score" id="roundScoreText"></div>
      <div class="wrong-list-title" id="wrongListTitle"></div>
      <div class="wrong-list" id="wrongList"></div>
      <div class="next-row">
        <button class="next-btn" id="restartBtn">새 라운드 시작</button>
      </div>
    </div>
  </section>

  <!-- Matching game panel -->
  <section class="panel hidden" id="matchPanel">
    <div class="match-controls">
      <label for="matchMode">모드:</label>
      <select id="matchMode">
        <option value="random">랜덤 단어</option>
        <option value="group" selected>헷갈리는 단어 묶음</option>
      </select>
      <label for="pairCount">카드 쌍 수:</label>
      <select id="pairCount">
        <option value="6">6쌍 (12장)</option>
        <option value="8" selected>8쌍 (16장)</option>
        <option value="10">10쌍 (20장)</option>
        <option value="12">12쌍 (24장)</option>
      </select>
      <button class="new-game-btn" id="newGameBtn">새 게임</button>
    </div>
    <div class="match-status" id="matchStatus">시도 0회 · 남은 쌍 0개</div>
    <div class="match-grid" id="matchGrid"></div>
    <div class="win-banner hidden" id="winBanner">🎉 모두 맞췄어요! 새 게임을 눌러 다시 도전하세요.</div>
    <div class="group-info hidden" id="groupInfo"></div>
  </section>
</main>

<footer>유노이아 영어국어학원 · 총 703 단어에서 무작위로 출제됩니다</footer>

</div>

/* ===================== 진행상황 저장(구글 시트) 연동 ===================== */
// 아래 URL을 Apps Script 배포 후 받은 "웹 앱 URL"로 바꿔주세요.
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz3Uaq5TtcafP4LeDucwwWrn5E4EwneJ1U4Nx9YQgm39YCg-Eq08lAxmVWjCB-87z04/exec";

let playerName = '';
let saveTimer = null;
let masteredWords = new Set(); // English words the student has ever answered correctly
let wrongCounts = {}; // { englishWord: totalTimesWrong } accumulated across all sessions

function saveIndicatorEl() {
  return document.getElementById('saveIndicator');
}

function updateMasteryDisplay() {
  const fill = document.getElementById('masteryBarFill');
  const text = document.getElementById('masteryBarText');
  const total = VOCAB.length;
  const done = masteredWords.size;
  const pct = total ? Math.round((done / total) * 100) : 0;
  if (fill) fill.style.width = pct + '%';
  if (text) text.textContent = `전체 어휘 진행: ${done} / ${total} (${pct}%)`;
}

function apiSave(state) {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('http') !== 0) return;
  const el = saveIndicatorEl();
  if (el) el.textContent = '저장 중...';
  const payload = Object.assign({
    name: playerName,
    masteredWords: Array.from(masteredWords),
    wrongCounts: wrongCounts
  }, state);
  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  }).then(() => {
    if (el) el.textContent = '저장됨 ✓';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { if (el) el.textContent = ''; }, 1500);
  }).catch(() => {
    if (el) el.textContent = '저장 실패 (인터넷 확인)';
  });
}

function apiLoad(name) {
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('http') !== 0) {
    return Promise.resolve({ found: false });
  }
  return fetch(APPS_SCRIPT_URL + '?name=' + encodeURIComponent(name))
    .then(r => r.json())
    .catch(() => ({ found: false }));
}

function speak(text, lang) {
  try {
    const doSpeak = () => {
      const u = new SpeechSynthesisUtterance(text);
      u.lang = lang;
      u.rate = lang === 'ko-KR' ? 0.8 : 0.9;
      window.speechSynthesis.speak(u);
    };
    if (window.speechSynthesis.speaking || window.speechSynthesis.pending) {
      window.speechSynthesis.cancel();
      // small delay after cancel() avoids the browser clipping the first syllable
      setTimeout(doSpeak, 120);
    } else {
      doSpeak();
    }
  } catch (e) { /* TTS unavailable */ }
}

// Extracts a short, speakable/displayable Korean meaning from a fuller dictionary-style
// entry: strips a leading "(...)" usage note, then cuts at the first comma/semicolon/
// colon/parenthesis so entries like "(가격을) 끌어올리다" don't come out blank.
function cleanKoreanText(s) {
  let t = s.replace(/^\([^)]*\)\s*/, '');
  t = t.split(/[,;:(]/)[0].trim();
  if (!t) {
    t = s.replace(/[()]/g, '');
    t = t.split(/[,;:]/)[0].trim();
  }
  return t || s;
}

// For speech only: "~" is textbook shorthand for a blank (e.g. "~에 대처하다").
// Reading the raw tilde sounds garbled, so read it aloud as "뭐뭐" instead.
function speakableKorean(s) {
  return cleanKoreanText(s).replace(/~/g, '뭐뭐');
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const FIRST_ROUND_SIZE = 30;
const MAX_ROUNDS = 5;
let quizDirection = 'eng'; // 'eng' = hear English, choose Korean; 'kor' = hear Korean, choose English
let currentItem = null;
let currentChoices = [];
let answered = false;
let score = 0;
let roundNumber = 1;
let roundPool = [];
let roundIndex = 0;
let roundWrong = [];
let attemptCounts = {}; // per-round retry counter, keyed by English word (reset each round)
const MAX_ATTEMPTS_PER_ROUND = 2; // a missed word gets requeued once, then counts as wrong for the round

const dirEngBtn = document.getElementById('dirEngBtn');
const dirKorBtn = document.getElementById('dirKorBtn');
const speakBtn = document.getElementById('speakBtn');
const choicesBox = document.getElementById('choicesBox');
const nextBtn = document.getElementById('nextBtn');
const quizIndexEl = document.getElementById('quizIndex');
const quizScoreEl = document.getElementById('quizScore');
const quizTotalEl = document.getElementById('quizTotal');
const roundNumLabel = document.getElementById('roundNumLabel');
const roundSizeLabel = document.getElementById('roundSizeLabel');
const roundTransition = document.getElementById('roundTransition');
const quizQuestionArea = document.getElementById('quizQuestionArea');
const quizResult = document.getElementById('quizResult');
const roundScoreText = document.getElementById('roundScoreText');
const wrongListTitle = document.getElementById('wrongListTitle');
const wrongList = document.getElementById('wrongList');
const restartBtn = document.getElementById('restartBtn');

dirEngBtn.addEventListener('click', () => {
  quizDirection = 'eng';
  dirEngBtn.classList.add('active');
  dirKorBtn.classList.remove('active');
  startSession();
});
dirKorBtn.addEventListener('click', () => {
  quizDirection = 'kor';
  dirKorBtn.classList.add('active');
  dirEngBtn.classList.remove('active');
  startSession();
});

function pickDistractors(correct, n) {
  const pool = VOCAB.filter(v => v[0] !== correct[0]);
  return shuffle(pool).slice(0, n);
}

function startSession() {
  roundNumber = 1;
  const unmastered = VOCAB.filter(v => !masteredWords.has(v[0]));
  if (unmastered.length === 0) {
    // everything mastered at least once -> full review mode
    roundTransition.textContent = '🎉 전체 703단어를 모두 한 번씩 맞혀봤어요! 복습 모드로 계속합니다.';
    roundTransition.classList.remove('hidden');
    setTimeout(() => roundTransition.classList.add('hidden'), 2200);
    roundPool = shuffle(VOCAB).slice(0, FIRST_ROUND_SIZE);
  } else {
    roundPool = shuffle(unmastered).slice(0, FIRST_ROUND_SIZE);
  }
  beginRound();
}

function resumeRound(state) {
  quizDirection = state.direction === 'kor' ? 'kor' : 'eng';
  if (quizDirection === 'eng') {
    dirEngBtn.classList.add('active'); dirKorBtn.classList.remove('active');
  } else {
    dirKorBtn.classList.add('active'); dirEngBtn.classList.remove('active');
  }
  roundNumber = state.roundNumber || 1;
  roundPool = (state.roundPool && state.roundPool.length) ? state.roundPool : shuffle(VOCAB).slice(0, FIRST_ROUND_SIZE);
  roundIndex = state.roundIndex || 0;
  score = state.score || 0;
  roundWrong = state.roundWrong || [];
  attemptCounts = {};
  quizResult.classList.add('hidden');
  quizQuestionArea.classList.remove('hidden');
  quizScoreEl.textContent = score;
  quizTotalEl.textContent = roundPool.length;
  roundNumLabel.textContent = roundNumber;
  roundSizeLabel.textContent = roundPool.length;
  roundTransition.textContent = `이어서 시작합니다 · ${roundNumber}차 라운드`;
  roundTransition.classList.remove('hidden');
  setTimeout(() => roundTransition.classList.add('hidden'), 1600);
  nextQuestion();
}

function initGameForPlayer() {
  if (resumedState) {
    resumeRound(resumedState);
  } else {
    startSession();
  }
}

function beginRound() {
  roundIndex = 0;
  score = 0;
  roundWrong = [];
  attemptCounts = {};
  quizResult.classList.add('hidden');
  quizQuestionArea.classList.remove('hidden');
  quizScoreEl.textContent = 0;
  quizTotalEl.textContent = roundPool.length;
  roundNumLabel.textContent = roundNumber;
  roundSizeLabel.textContent = roundPool.length;
  nextQuestion();
}

function nextQuestion() {
  if (roundIndex >= roundPool.length) {
    finishRound();
    return;
  }
  answered = false;
  roundIndex++;
  quizIndexEl.textContent = roundIndex;
  quizTotalEl.textContent = roundPool.length;
  roundSizeLabel.textContent = roundPool.length;

  currentItem = roundPool[roundIndex - 1];
  const distractors = pickDistractors(currentItem, 3);
  currentChoices = shuffle([currentItem, ...distractors]);

  choicesBox.innerHTML = '';
  currentChoices.forEach(choice => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = quizDirection === 'eng' ? choice[1] : choice[0];
    btn.addEventListener('click', () => selectChoice(btn, choice));
    choicesBox.appendChild(btn);
  });

  nextBtn.disabled = true;
  nextBtn.textContent = roundIndex === roundPool.length ? '라운드 결과' : '다음 문제';
  speakCurrent();
}

function speakCurrent() {
  if (quizDirection === 'eng') {
    speak(currentItem[0], 'en-US');
  } else {
    speak(speakableKorean(currentItem[1]), 'ko-KR');
  }
}

speakBtn.addEventListener('click', speakCurrent);

function selectChoice(btn, choice) {
  if (answered) return;
  answered = true;
  const isCorrect = choice[0] === currentItem[0];
  if (isCorrect) {
    btn.classList.add('correct');
    score++;
    masteredWords.add(currentItem[0]);
    updateMasteryDisplay();
  } else {
    btn.classList.add('wrong');
    const word = currentItem[0];
    wrongCounts[word] = (wrongCounts[word] || 0) + 1; // cumulative, across all sessions
    attemptCounts[word] = (attemptCounts[word] || 0) + 1; // this round only

    if (attemptCounts[word] < MAX_ATTEMPTS_PER_ROUND) {
      // requeue soon (3~5 questions later) so the word gets another shot right away
      const gap = 3 + Math.floor(Math.random() * 3);
      const insertAt = Math.min(roundIndex + gap, roundPool.length);
      roundPool.splice(insertAt, 0, currentItem);
    } else {
      // already retried once and missed again -> counts as wrong for this round
      roundWrong.push(currentItem);
    }

    // reveal correct
    [...choicesBox.children].forEach((c, i) => {
      if (currentChoices[i][0] === currentItem[0]) c.classList.add('correct');
    });
  }
  [...choicesBox.children].forEach(c => c.disabled = true);
  quizScoreEl.textContent = score;
  nextBtn.disabled = false;

  apiSave({
    status: 'in_progress',
    direction: quizDirection,
    roundNumber: roundNumber,
    roundIndex: roundIndex,
    roundPool: roundPool,
    score: score,
    roundWrong: roundWrong,
    lastAnswerCorrect: isCorrect
  });
}

function finishRound() {
  // perfect round, or we've used up all 5 rounds -> end session and show final list
  if (roundWrong.length === 0 || roundNumber >= MAX_ROUNDS) {
    showFinalResult();
    return;
  }
  // otherwise cascade into a new round made only of this round's misses
  roundNumber++;
  roundPool = shuffle(roundWrong);
  roundTransition.textContent = `${roundNumber}차 라운드 시작 · 복습 단어 ${roundPool.length}개`;
  roundTransition.classList.remove('hidden');
  setTimeout(() => {
    roundTransition.classList.add('hidden');
  }, 1600);
  beginRound();
}

function showFinalResult() {
  quizQuestionArea.classList.add('hidden');
  quizResult.classList.remove('hidden');
  roundScoreText.textContent = `${roundNumber}차 라운드까지 완료 · 이번 라운드 ${roundPool.length}문제 중 ${score}개 정답`;

  apiSave({
    status: 'done',
    direction: quizDirection,
    roundNumber: roundNumber,
    roundIndex: roundIndex,
    roundPool: roundPool,
    score: score,
    roundWrong: roundWrong,
    finalWrongWords: roundWrong
  });

  if (roundWrong.length === 0) {
    wrongListTitle.textContent = '';
    wrongList.innerHTML = '<div class="no-wrong">🎉 모든 단어를 다 맞혔어요!</div>';
  } else {
    wrongListTitle.textContent = `끝까지 틀린 단어 ${roundWrong.length}개 — 복습해보세요`;
    wrongList.innerHTML = '';
    roundWrong.forEach(item => {
      const div = document.createElement('div');
      div.className = 'wrong-item';
      div.innerHTML = `<span class="w-eng"></span><span class="w-kor"></span>`;
      div.querySelector('.w-eng').textContent = item[0];
      div.querySelector('.w-kor').textContent = item[1];
      wrongList.appendChild(div);
    });
  }
}

nextBtn.addEventListener('click', nextQuestion);
restartBtn.addEventListener('click', startSession);

/* ===================== Matching game ===================== */
let matchInitialized = false;
let selectedCards = [];
let matchedCount = 0;
let totalPairs = 0;
let attempts = 0;
let lockBoard = false;

const pairCountSel = document.getElementById('pairCount');
const matchModeSel = document.getElementById('matchMode');
const newGameBtn = document.getElementById('newGameBtn');
const matchGrid = document.getElementById('matchGrid');
const matchStatus = document.getElementById('matchStatus');
const winBanner = document.getElementById('winBanner');
const groupInfo = document.getElementById('groupInfo');
let currentGroups = [];

newGameBtn.addEventListener('click', startMatchGame);
matchModeSel.addEventListener('change', startMatchGame);
pairCountSel.addEventListener('change', startMatchGame);

// 묶음 모드: 같은 묶음의 단어들을 통째로 넣어서, 뜻이 비슷한 카드끼리 섞이게 한다.
function pickGroupItems(target) {
  const pool = shuffle(GROUPS);
  const chosenGroups = [];
  let count = 0;
  for (const g of pool) {
    if (count >= target) break;
    if (count + g.length <= target) {
      chosenGroups.push(g);
      count += g.length;
    }
  }
  // 아직 자리가 남으면 가장 작은 묶음으로 채워본다
  if (count < target) {
    for (const g of pool) {
      if (chosenGroups.indexOf(g) !== -1) continue;
      if (count + g.length <= target) { chosenGroups.push(g); count += g.length; }
      if (count >= target) break;
    }
  }
  currentGroups = chosenGroups;
  const items = [];
  const seen = new Set();
  chosenGroups.forEach(g => g.forEach(w => {
    if (!seen.has(w) && VOCAB_MAP[w] !== undefined) {
      seen.add(w);
      items.push([w, VOCAB_MAP[w]]);
    }
  }));
  return items;
}

function startMatchGame() {
  matchInitialized = true;
  winBanner.classList.add('hidden');
  groupInfo.classList.add('hidden');
  selectedCards = [];
  matchedCount = 0;
  attempts = 0;
  lockBoard = false;
  const target = parseInt(pairCountSel.value, 10);
  const mode = matchModeSel.value;

  let chosen;
  if (mode === 'group') {
    chosen = pickGroupItems(target);
  } else {
    currentGroups = [];
    chosen = shuffle(VOCAB).slice(0, target);
  }
  totalPairs = chosen.length;

  // 묶음 모드에서는 뜻 전체를 보여줘서 비슷한 단어끼리도 구분되게 한다.
  // 같은 뜻이 적힌 카드는 서로 같은 짝으로 인정한다(meaningKey).
  const cards = [];
  chosen.forEach((item, i) => {
    const korText = mode === 'group' ? item[1].replace(/^\([^)]*\)\s*/, '') : cleanKoreanText(item[1]);
    const key = korText;
    cards.push({ type: 'eng', text: item[0], pairId: i, meaningKey: key });
    cards.push({ type: 'kor', text: korText, pairId: i, meaningKey: key });
  });
  const shuffled = shuffle(cards);

  matchGrid.innerHTML = '';
  shuffled.forEach(card => {
    const div = document.createElement('div');
    div.className = 'match-card' + (card.type === 'eng' ? ' eng' : '');
    div.textContent = card.text;
    div.dataset.pairId = card.pairId;
    div.dataset.type = card.type;
    div.addEventListener('click', () => onCardClick(div, card));
    matchGrid.appendChild(div);
  });

  updateMatchStatus();
}

function updateMatchStatus() {
  matchStatus.textContent = `시도 ${attempts}회 · 남은 쌍 ${totalPairs - matchedCount}개`;
}

function showGroupInfo() {
  if (!currentGroups.length) return;
  let h = '<div class="gi-title">이번 판의 헷갈리는 단어 묶음 — 차이를 기억해두세요</div>';
  currentGroups.forEach(g => {
    h += '<div class="gi-group">';
    g.forEach(w => {
      if (VOCAB_MAP[w] === undefined) return;
      const safeW = w.replace(/&/g, '&amp;').replace(/</g, '&lt;');
      const safeM = VOCAB_MAP[w].replace(/&/g, '&amp;').replace(/</g, '&lt;');
      h += '<span class="gi-item"><b>' + safeW + '</b> — ' + safeM + '</span>';
    });
    h += '</div>';
  });
  groupInfo.innerHTML = h;
  groupInfo.classList.remove('hidden');
}

function onCardClick(div, card) {
  if (lockBoard) return;
  if (div.classList.contains('matched') || div.classList.contains('selected')) return;
  if (selectedCards.length >= 2) return;

  div.classList.add('selected');
  const spokenText = card.type === 'eng' ? card.text : cleanKoreanText(card.text).replace(/~/g, '뭐뭐');
  speak(spokenText, card.type === 'eng' ? 'en-US' : 'ko-KR');
  selectedCards.push({ div, card });

  if (selectedCards.length === 2) {
    attempts++;
    updateMatchStatus();
    const [a, b] = selectedCards;
    const isMatch = a.card.type !== b.card.type &&
      (a.card.pairId === b.card.pairId || a.card.meaningKey === b.card.meaningKey);

    // 단어 카드 1장 + 뜻 카드 1장으로 짝을 시도한 경우에만, 그 단어를 진행률/오답 기록에 반영한다
    // (단어-단어, 뜻-뜻 조합은 실제 뜻을 아는지 테스트한 게 아니므로 반영하지 않음)
    const engCard = a.card.type === 'eng' ? a.card : (b.card.type === 'eng' ? b.card : null);
    const testedWord = (a.card.type !== b.card.type && engCard) ? engCard.text : null;

    if (isMatch) {
      a.div.classList.add('matched');
      b.div.classList.add('matched');
      a.div.classList.remove('selected');
      b.div.classList.remove('selected');
      matchedCount++;
      selectedCards = [];
      updateMatchStatus();
      if (testedWord) {
        masteredWords.add(testedWord);
        updateMasteryDisplay();
        apiSave({ status: 'in_progress', direction: quizDirection, roundNumber: roundNumber, roundIndex: roundIndex, roundPool: roundPool, score: score, roundWrong: roundWrong });
      }
      if (matchedCount === totalPairs) {
        winBanner.classList.remove('hidden');
        showGroupInfo();
      }
    } else {
      if (testedWord) {
        wrongCounts[testedWord] = (wrongCounts[testedWord] || 0) + 1;
        apiSave({ status: 'in_progress', direction: quizDirection, roundNumber: roundNumber, roundIndex: roundIndex, roundPool: roundPool, score: score, roundWrong: roundWrong });
      }
      lockBoard = true;
      setTimeout(() => {
        a.div.classList.remove('selected');
        b.div.classList.remove('selected');
        lockBoard = false;
        selectedCards = [];
      }, 700);
    }
  }
}

/* init happens via the name gate -> initGameForPlayer() */
